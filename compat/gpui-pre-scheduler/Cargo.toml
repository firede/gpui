# Made by script/import-zed: Zed's `scheduler` under the name, version and features
# of gpui-pre's `gpui-pre-scheduler`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-scheduler"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "scheduler"
path = "lib.rs"
doctest = false

[features]
test-support = ["upstream/test-support"]
wasm-threads = ["upstream/wasm-threads"]

[dependencies]
upstream = { package = "scheduler", path = "../../crates/scheduler", default-features = false }
