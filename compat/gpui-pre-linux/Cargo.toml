# Made by script/import-zed: Zed's `gpui_linux` under the name, version and features
# of gpui-pre's `gpui-pre-linux`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-linux"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "gpui_linux"
path = "lib.rs"
doctest = false

[features]
default = ["upstream/default"]
screen-capture = ["upstream/screen-capture"]
test-support = ["upstream/test-support"]
wayland = ["upstream/wayland"]
x11 = ["upstream/x11"]

[dependencies]
upstream = { package = "gpui_linux", path = "../../crates/gpui_linux", default-features = false }
