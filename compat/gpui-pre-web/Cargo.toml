# Made by script/import-zed: Zed's `gpui_web` under the name, version and features
# of gpui-pre's `gpui-pre-web`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-web"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "gpui_web"
path = "lib.rs"
doctest = false

[features]
default = ["upstream/default"]
multithreaded = ["upstream/multithreaded"]

[dependencies]
upstream = { package = "gpui_web", path = "../../crates/gpui_web", default-features = false }
