# Made by script/import-zed: Zed's `gpui_windows` under the name, version and features
# of gpui-pre's `gpui-pre-windows`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-windows"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "gpui_windows"
path = "lib.rs"
doctest = false

[features]
default = ["upstream/default"]
screen-capture = ["upstream/screen-capture"]
test-support = ["upstream/test-support"]

[dependencies]
upstream = { package = "gpui_windows", path = "../../crates/gpui_windows", default-features = false }
