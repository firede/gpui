# Made by script/import-zed: Zed's `sum_tree` under the name, version and features
# of gpui-pre's `gpui-pre-sum-tree`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-sum-tree"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "sum_tree"
path = "lib.rs"
doctest = false

[features]
test-support = ["upstream/test-support"]

[dependencies]
upstream = { package = "sum_tree", path = "../../crates/sum_tree", default-features = false }
