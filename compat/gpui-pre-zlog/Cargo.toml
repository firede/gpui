# Made by script/import-zed: Zed's `zlog` under the name, version and features
# of gpui-pre's `gpui-pre-zlog`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-zlog"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "zlog"
path = "lib.rs"
doctest = false

[features]
default = ["upstream/default"]

[dependencies]
upstream = { package = "zlog", path = "../../crates/zlog", default-features = false }
