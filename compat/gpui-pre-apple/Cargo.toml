# Made by script/import-zed: Zed's `gpui_apple` under the name, version and features
# of gpui-pre's `gpui-pre-apple`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-apple"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "gpui_apple"
path = "lib.rs"
doctest = false

[features]
default = ["upstream/default"]
bench-support = ["upstream/bench-support"]
font-kit = ["upstream/font-kit"]
runtime_shaders = ["upstream/runtime_shaders"]
test-support = ["upstream/test-support"]

[dependencies]
upstream = { package = "gpui_apple", path = "../../crates/gpui_apple", default-features = false }
