# Made by script/import-zed: Zed's `bench_metrics` under the name, version and features
# of gpui-pre's `gpui-pre-bench-metrics`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-bench-metrics"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "bench_metrics"
path = "lib.rs"
doctest = false

[features]
test-support = ["upstream/test-support"]

[dependencies]
upstream = { package = "bench_metrics", path = "../../crates/bench_metrics", default-features = false }
