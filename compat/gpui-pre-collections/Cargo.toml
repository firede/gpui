# Made by script/import-zed: Zed's `collections` under the name, version and features
# of gpui-pre's `gpui-pre-collections`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-collections"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "collections"
path = "lib.rs"
doctest = false

[features]
test-support = ["upstream/test-support"]

[dependencies]
upstream = { package = "collections", path = "../../crates/collections", default-features = false }
