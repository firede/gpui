# Made by script/import-zed: Zed's `gpui_ios` under the name, version and features
# of gpui-pre's `gpui-pre-ios`, for an application's [patch.crates-io] (README.md).
[package]
name = "gpui-pre-ios"
version = "0.3.10"
license = "Apache-2.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "gpui_ios"
path = "lib.rs"
doctest = false

[features]
runtime_shaders = ["upstream/runtime_shaders"]

[dependencies]
upstream = { package = "gpui_ios", path = "../../crates/gpui_ios", default-features = false }
